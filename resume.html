<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - Career Builder</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">Career Builder</div>
        <nav>
            <ul>
                <li><a href="/" data-link>Home</a></li>
                <li><a href="/resume.html" data-link>Resume Builder</a></li>
                <li><a href="/cover_letter.html" data-link>Cover Letter Generator</a></li>
                <li><a href="/ats.html" data-link>ATS Score Calculator</a></li>
                <li><a href="/profile.html" data-link>Profile</a></li>
                <li><a href="/login.html" data-link>Login</a></li>
                <li><a href="/signup.html" data-link>Sign Up</a></li>
            </ul>
        </nav>
    </header>
    <main id="main-content">
        <h1>Resume Builder</h1>
        <form id="resume-form">
            <h2>Personal Information</h2>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
            <label for="linkedin">LinkedIn Profile:</label>
            <input type="url" id="linkedin" name="linkedin">

            <h2>Education</h2>
            <div id="education-section">
                <!-- Education entries will be added here dynamically -->
            </div>
            <button type="button" id="add-education">Add Education</button>

            <h2>Work Experience</h2>
            <div id="experience-section">
                <!-- Experience entries will be added here dynamically -->
            </div>
            <button type="button" id="add-experience">Add Experience</button>

            <h2>Skills</h2>
            <textarea id="skills" name="skills" rows="4"></textarea>

            <button type="submit">Generate Resume</button>
        </form>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
